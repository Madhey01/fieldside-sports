:26px}.heroMain{border-radius:22px;padding:30px;background:linear-gradient(125deg,#1c2c3d,#111923 70%);color:#f4f8fb;position:relative;overflow:hidden;min-height:275px;display:flex;flex-direction:column;justify-content:space-between}.heroMain:after{content:'◉';position:absolute;font-size:240px;right:-12px;top:-65px;color:#b7f36b12;transform:rotate(-15deg)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;font-weight:900;color:#b7f36b}.hero h1{font-size:clamp(32px,4vw,51px);line-height:1.04;letter-spacing:-2px;margin:12px 0;max-width:540px}.hero p{color:#b8c5d2;max-width:470px;margin:0 0 22px}.heroBtns{display:flex;gap:10px;flex-wrap:wrap}.heroSide{display:grid;gap:14px}.sideCard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}.sideCard .big{font-size:30px;font-weight:900;letter-spacing:-1px}.sideCard p{margin:4px 0;color:var(--muted);font-size:13px}.sideBottom{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:var(--surface2);font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:30px 0 15px}.sectionHead h2{margin:0;font-size:23px;letter-spacing:-.8px}.sectionHead p{margin:4px 0 0;color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.search{min-width:210px;flex:1;position:relative}.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none}.filterBtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:10px 14px;border-radius:12px;font-weight:800}.filterBtn.active{background:var(--accent);border-color:var(--accent);color:var(--accentText)}.matches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.match{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:17px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}.match:hover{transform:translateY(-2px);border-color:light-dark(#b8c5d0,#4c6074)}.matchTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px;gap:8px}.sportLabel{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:1px;text-transform:uppercase}.state{font-size:10px;text-transform:uppercase;font-weight:900;color:var(--muted)}.state.live{color:var(--red)}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team{text-align:center;padding:12px 5px;background:var(--surface2);border-radius:13px}.crest{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;margin:0 auto 8px;font-size:19px;font-weight:900;background:var(--surface);border:1px solid var(--line)}.team strong{display:block;font-size:13px}.team small{color:var(--muted);font-size:11px}.score{font-weight:900;font-size:16px;margin-top:4px}.matchMeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin:14px 0}.matchFoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:13px}.matchFoot span{font-size:12px;color:var(--muted)}.textbtn{border:0;background:transparent;color:var(--text);font-size:12px;font-weight:900;padding:6px}.empty{grid-column:1/-1;padding:35px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.lower{display:grid;grid-template-columns:1fr .8fr;gap:18px;margin-top:30px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:21px}.panel h3{margin:0 0 15px;font-size:18px}.newsItem{display:flex;gap:13px;padding:13px 0;border-top: ns:1.2fr .8fr;gap:16px}.videoBox{aspect-ratio:16/9;background:linear-gradient(140deg,#172638,#0b1017);border-radius:17px;display:grid;place-items:center;text-align:center;padding:20px;color:#f3f7fa}.play{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accentText);font-size:22px;margin:0 auto 13px}.modalBackdrop{position:fixed;inset:0;background:#03070bc9;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalBackdrop.open{display:flex}.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:23px}.modalHead{display:flex;justify-content:space-between;align-items:start;gap:12px}.modalHead h2{margin:0}.close{border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);padding:7px 10px}.modalScores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin:22px 0}.modalScores .crest{width:58px;height:58px;font-size:24px}.modalScores strong{display:block}.modalScores small{color:var(--muted)}.detailRows{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:var(--surface2);padding:12px;border-radius:11px}.detail small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:900}.detail strong{font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:800;z-index:30;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}footer{border-top:1px solid var(--line);padding:22px 24px;color:var(--muted);font-size:12px}.footerInner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.sampleTag{display:inline-flex;font-size:10px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:light-dark(#76591c,#f1d38a);background:light-dark(#fff3ce,#3d321d);padding:4px 7px;border-radius:6px}
@media(max-width:900px){.nav{gap:14px;flex-wrap:wrap}.navlinks{order:3;flex-basis:100%;overflow:auto}.navright{margin-left:auto}.hero{grid-template-columns:1fr}.heroSide{grid-template-columns:1fr 1fr}.matches{grid-template-columns:repeat(2,minmax(0,1fr))}.lower,.videoGrid{grid-template-columns:1fr}}@media(max-width:600px){.nav{padding:14px 15px}.navlinks button{padding:8px 10px;font-size:12px}.navright .btn{padding:8px 10px;font-size:12px}.wrap{padding:20px 14px 42px}.heroMain{padding:23px;min-height:270px}.hero h1{letter-spacing:-1.5px}.heroSide{grid-template-columns:1fr 1fr}.sideCard{padding:15px}.sideCard .big{font-size:25px}.matches{grid-template-columns:1fr}.sectionHead{align-items:start;flex-direction:column}.pageTitle{flex-direction:column}.pageTitle h1{font-size:28px}.adminGrid{grid-template-columns:1fr}.formRow{grid-template-columns:1fr}.detailRows{grid-template-columns:1fr 1fr}.modal{padding:17px}.brand{font-size:19px}}

<body><div class="app">
<div class="topline"></div><header><nav class="nav"><div class="brand"><div class="brandmark">F</div><div>FIELDSIDE<small>SPORTS, LIVE & CLEAR</small></div></div><div class="navlinks" id="navlinks"><button class="active" data-page="home">Home</button><button data-page="cricket">Cricket</button><button data-page="football">Football</button><button data-page="news">News</button><button data-page="video">Watch</button></div><div class="navright"><button class="btn" id="themeBtn" title="Toggle theme">◐ Theme</button><button class="btn primary" data-page="admin">Admin ↗</button></div></nav></header>
<main class="wrap" id="main"></main><footer><div class="footerInner"><span>© 2026 Fieldside. A fresh sports experience.</span><span>Demo prototype · All match data is illustrative, not live.</span></div></footer></div>
<div class="modalBackdrop" id="modalBackdrop" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const initialMatches=[
{id:1,sport:'Cricket',competition:'International T20 · Demo',home:'Nepal',away:'UAE',homeShort:'NEP',awayShort:'UAE',homeIcon:'🇳🇵',awayIcon:'🇦🇪',date:'2026-10-18T14:15:00+05:45',status:'Upcoming',venue:'Tribhuvan University Ground',scoreHome:'—',scoreAway:'—',note:'Illustrative fixture · not official'},
{id:2,sport:'Football',competition:'Premier League · Demo',home:'Arsenal',away:'Liverpool',homeShort:'ARS',awayShort:'LIV',homeIcon:'🔴',awayIcon:'🔺',date:'2026-10-18T20:00:00+05:45',status:'Upcoming',venue:'Emirates Stadium',scoreHome:'—',scoreAway:'—',note:'Illustrative fixture · not official'},
{id:3,sport:'Cricket',competition:'Club T20 · Demo',home:'Kathmandu',away:'Pokhara',homeShort:'KTM',awayShort:'PKR',homeIcon:'🏔️',awayIcon:'🌊',date:'2026-10-18T11:30:00+05:45',status:'Upcoming',venue:'Demo Cricket Arena',scoreHome:'—',scoreAway:'—',note:'Fictional teams and fixture'},
{id:4,sport:'Football',competition:'La Liga · Demo',home:'Barcelona',away:'Real Madrid',homeShort:'BAR',awayShort:'RMA',homeIcon:'🔵',awayIcon:'⚪',date:'2026-10-19T00:15:00+05:45',status:'Upcoming',venue:'Estadi Olímpic',scoreHome:'—',scoreAway:'—',note:'Illustrative fixture · not official'},
{id:5,sport:'Cricket',competition:'One Day · Demo',home:'India',away:'Australia',homeShort:'IND',awayShort:'AUS',homeIcon:'🇮🇳',awayIcon:'🇦🇺',date:'2026-10-19T13:45:00+05:45',status:'Upcoming',venue:'Demo International Stadium',scoreHome:'—',scoreAway:'—',note:'Illustrative fixture · not official'},
{id:6,sport:'Football',competition:'International Friendly · Demo',home:'Nepal',away:'Japan',homeShort:'NEP',awayShort:'JPN',homeIcon:'🇳🇵',awayIcon:'🇯🇵',date:'2026-10-20T18:30:00+05:45',status:'Upcoming',venue:'Demo National Stadium',scoreHome:'—',scoreAway:'—',note:'Illustrative fixture · not official'}
];
const initialNews=[{id:1,icon:'🏏',category:'Cricket · Preview',title:'What to look for in the next T20 contest',summary:'A sample editorial format for team form, key matchups and conditions.',date:'Demo article'},{id:2,icon:'⚽',category:'Football · Analysis',title:'Three tactical questions ahead of the weekend',summary:'A placeholder analysis story with room for lineups and team news.',date:'Demo article'},{id:3,icon:'📊',category:'Data · Explainer',title:'How to read a match scorecard',summary:'A beginner-friendly guide to innings, overs, possession and match stats.',date:'Evergreen demo'}];
let matches=load('fieldside_matches',initialMatches),news=load('fieldside_news',initialNews),currentPage='home',sportFilter='All',searchTerm='';function load(k,fallback){try{const x=localStorage.getItem(k);return x?JSON.parse(x):fallback}catch{return fallback}}function save(){localStorage.setItem('fieldside_matches',JSON.stringify(matches));localStorage.setItem('fieldside_news',JSON.stringify(news))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateFmt(s){const d=new Date(s);return d.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}function dateShort(s){return new Date(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function navigate(p){currentPage=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));document.getElementById('themeBtn').onclick=()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('color-scheme');document.documentElement.style.colorScheme=dark.includes('dark')?'light':'dark';toast('Theme changed')};
function matchCard(m){return `<article class="match"><div class="matchTop"><span class="sportLabel">${m.sport} · ${esc(m.competition.split(' · ')[0])}</span><span class="state ${m.status==='Live'?'live':''}">${m.status==='Live'?'<i class="dot"></i> ':''}${esc(m.status)}</span></div><div class="teams"><div class="team"><div class="crest">${esc(m.homeIcon||'🏆')}</div><strong>${esc(m.home)}</strong><small>${esc(m.homeShort||'HOME')}</small>${m.status==='Live'?`<div class="score">${esc(m.scoreHome)}</div>`:''}</div><div class="team"><div class="crest">${esc(m.awayIcon||'🏆')}</div><strong>${esc(m.away)}</strong><small>${esc(m.awayShort||'AWAY')}</small>${m.status==='Live'?`<div class="score">${esc(m.scoreAway)}</div>`:''}</div></div><div class="matchMeta"><span>◷ ${dateFmt(m.date)}</span><span>⌖ ${esc(m.venue)}</span></div><div class="matchFoot"><span>${m.status==='Upcoming'?'Starts '+dateShort(m.date):m.status==='Live'?'Demo score':'Finished'}</span><button class="textbtn" onclick="showMatch(${m.id})">Match centre ↗</button></div></article>`}
function filteredMatches(sport){return matches.filter(m=>(!sport||sport==='All'||m.sport===sport)&&(`${m.home} ${m.away} ${m.competition} ${m.venue}`.toLowerCase().includes(searchTerm.toLowerCase()))).sort((a,b)=>new Date(a.date)-new Date(b.date))}
function home(){const upcoming=filteredMatches('All');return `<section class="hero"><div class="heroMain"><div><span class="eyebrow">YOUR SPORTS, YOUR WAY</span><h1>Every match has<br>a bigger story.</h1><p>Follow the fixtures, find the details, and catch up on cricket and football — all in one clean place.</p><div class="heroBtns"><button class="btn primary" onclick="navigate('cricket')">Explore cricket ↗</button><button class="btn" style="background:#ffffff12;color:#fff;border-color:#ffffff25" onclick="navigate('football')">Explore football</button></div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill" style="background:#ffffff15;color:#e5edf5">● Fixtures & results</span><span class="pill" style="background:#ffffff15;color:#e5edf5">◈ Match centre</span><span class="pill" style="background:#ffffff15;color:#e5edf5">↗ Editorial</span></div></div><div class="heroSide"><div class="sideCard"><div><span class="pill">This prototype</span><div class="big">${matches.length} <span style="font-size:15px;color:var(--muted);letter-spacing:0">sample fixtures</span></div><p>Cricket and football fixtures to explore. No live feed connected.</p></div><div class="sideBottom"><span class="sampleTag">Demo data</span><button class="textbtn" onclick="navigate('admin')">Manage data ↗</button></div></div><div class="sideCard"><div><span class="pill">Built for fans</span><div class="big">One place.</div><p>Schedules, team details, editorial stories and authorized watch links.</p></div><div class="sideBottom"><span style="font-size:12px;color:var(--muted)">Responsive by design</span><span>✳</span></div></div></div></section><div class="sectionHead"><div><h2>Upcoming fixtures</h2><p>What’s on next — sample schedule, not live data.</p></div><button class="btn small" onclick="navigate('cricket')">All fixtures ↗</button></div><div class="filters"><div class="search"><input id="searchHome" placeholder="Search teams, competitions, venues…" value="${esc(searchTerm)}" oninput="searchTerm=this.value;refreshMatches('homeMatches','All')"></div><button class="filterBtn ${sportFilter==='All'?'active':''}" onclick="sportFilter='All';refreshMatches('homeMatches','All')">All sports</button><button class="filterBtn ${sportFilter==='Cricket'?'active':''}" onclick="sportFilter='Cricket';refreshMatches('homeMatches','All')">🏏 Cricket</button><button class="filterBtn ${sportFilter==='Football'?'active':''}" onclick="sportFilter='Football';refreshMatches('homeMatches','All')">⚽ Football</button></div><div class="matches" id="homeMatches">${renderCards(upcoming.filter(m=>sportFilter==='All'||m.sport===sportFilter))}</div><div class="lower"><section class="panel"><div class="sectionHead" style="margin:0 0 8px"><div><h2>From the newsroom</h2><p>Stories and explainers</p></div><button class="textbtn" onclick="navigate('news')">All stories ↗</button></div>${news.slice(0,3).map(newsItem).join('')}</section><section class="panel"><h3>Jump into the game</h3><div class="quickList"><div class="quick"><div><strong>🏏 Cricket centre</strong><small>Fixtures, innings and scorecards</small></div><button class="textbtn" onclick="navigate('cricket')">Open ↗</button></div><div class="quick"><div><strong>⚽ Football centre</strong><small>Match details and lineups</small></div><button class="textbtn" onclick="navigate('football')">Open ↗</button></div><div class="quick"><div><strong>▶ Watch legally</strong><small>Official broadcaster links only</small></div><button class="textbtn" onclick="navigate('video')">Explore ↗</button></div><div class="notice" style="margin-bottom:0">Demo only: scores, dates, teams and articles on this prototype are sample content. Verify real fixtures with an official provider.</div></div></section></div>`}
function renderCards(arr){return arr.length?arr.map(matchCard).join(''):'<div class="empty">No matches found. Try another search or filter.</div>'}function refreshMatches(id,sport){const el=document.getElementById(id);if(el)el.innerHTML=renderCards(filteredMatches(sport).filter(m=>sportFilter==='All'||m.sport===sportFilter));document.querySelectorAll('.filters .filterBtn').forEach(b=>b.classList.toggle('active',b.textContent.includes(sportFilter==='All'?'All sports':sportFilter)))}function sportPage(sport){return `<div class="pageTitle"><div><span class="eyebrow">MATCH CENTRE / ${sport.toUpperCase()}</span><h1>${sport==='Cricket'?'Cricket, ball by ball.':'Football, from kick-off.'}</h1><p>Find fixtures and open a match for more details. Sample content only.</p></div><span class="sampleTag">Sample schedule</span></div><div class="filters"><div class="search"><input placeholder="Search ${sport.toLowerCase()} fixtures…" value="${esc(searchTerm)}" oninput="searchTerm=this.value;document.getElementById('sportMatches').innerHTML=renderCards(filteredMatches('${sport}'))"></div><button class="filterBtn active">All fixtures</button></div><div class="matches" id="sportMatches">${renderCards(filteredMatches(sport))}</div>`}
function newsItem(n){return `<article class="newsItem"><div class="newsIcon">${esc(n.icon||'📰')}</div><div><small>${esc(n.category||'News')}</small><strong>${esc(n.title)}</strong><p>${esc(n.summary)}</p></div></article>`}function newsPage(){return `<div class="pageTitle"><div><span class="eyebrow">THE SIDELINE</span><h1>Stories beyond the score.</h1><p>Editorial placeholders ready for your own reporting and analysis.</p></div><span class="sampleTag">Sample content</span></div><div class="lower" style="margin-top:0"><section class="panel">${news.map(newsItem).join('')}</section><section class="panel"><h3>Build your newsroom</h3><p style="color:var(--muted);font-size:13px">The admin area can add editorial content locally in this prototype. A production build should store articles in PostgreSQL and include image uploads, draft status, author roles, and publishing dates.</p><button class="btn primary" onclick="navigate('admin')">Open admin dashboard ↗</button></section></div>`}
function videoPage(){return `<div class="pageTitle"><div><span class="eyebrow">OFFICIAL WATCH LINKS</span><h1>Find where to watch.</h1><p>Connect viewers to authorized broadcasters and rights-holder streams.</p></div><span class="sampleTag">No streams connected</span></div><div class="videoGrid"><section class="panel"><div class="videoBox"><div><div class="play">▶</div><strong style="font-size:18px">Your official stream goes here</strong><p style="color:#b8c5d2;font-size:12px;max-width:330px">No video is playing in this demo. Add an authorized provider URL or licensed embed in the production version.</p></div></div><div class="notice">We won't embed unauthorized streams or copy another site's stream links. Use broadcaster-provided embeds or link to their official viewing page.</div></section><section class="panel"><h3>Available integrations</h3><div class="quickList"><div class="quick"><div><strong>Official broadcaster</strong><small>Outbound link supplied by rights holder</small></div><span class="pill">Planned</span></div><div class="quick"><div><strong>Provider embed</strong><small>Allowed iframe or player SDK</small></div><span class="pill">Planned</span></div><div class="quick"><div><strong>Regional availability</strong><small>Show where a match is available</small></div><span class="pill">Planned</span></div></div><p style="font-size:12px;color:var(--muted);margin-top:18px">Streaming availability and territorial rights must be verified for each competition.</p></section></div>`}
function adminPage(){return `<div class="pageTitle"><div><span class="eyebrow">CONTROL ROOM</span><h1>Admin dashboard</h1><p>Manage the prototype's sample fixtures and newsroom content.</p></div><span class="sampleTag">Local demo only</span></div><div class="notice">Changes are saved in this browser using local storage. This is not a secure production admin system; do not enter private data. Production needs server-side authentication, roles and a database.</div><div class="adminGrid"><section class="panel"><h3>➕ Add a fixture</h3><form id="matchForm"><div class="field"><label>Sport</label><select name="sport"><option>Cricket</option><option>Football</option></select></div><div class="formRow"><div class="field"><label>Home team</label><input name="home" required placeholder="e.g. Kathmandu"></div><div class="field"><label>Away team</label><input name="away" required placeholder="e.g. Pokhara"></div></div><div class="field"><label>Competition</label><input name="competition" required placeholder="League / tournament"></div><div class="formRow"><div class="field"><label>Date and time</label><input name="date" type="datetime-local" required></div><div class="field"><label>Status</label><select name="status"><option>Upcoming</option><option>Live</option><option>Finished</option></select></div></div><div class="field"><label>Venue</label><input name="venue" placeholder="Stadium / ground"></div><div class="formRow"><div class="field"><label>Home score (optional)</label><input name="scoreHome" placeholder="—"></div><div class="field"><label>Away score (optional)</label><input name="scoreAway" placeholder="—"></div></div><button class="btn primary" type="submit">Save fixture</button></form></section><section class="panel"><h3>✍ Add a story</h3><form id="newsForm"><div class="field"><label>Category</label><input name="category" required placeholder="Cricket · Preview"></div><div class="field"><label>Headline</label><input name="title" required placeholder="Your story headline"></div><div class="field"><label>Summary</label><textarea name="summary" required placeholder="A short summary for the homepage"></textarea></div><button class="btn primary" type="submit">Publish to demo site</button></form><div class="notice">For production: add draft/publish states, rich text, safe image uploads, author permissions and audit logs.</div></section></div><section class="panel" style="margin-top:16px"><div class="sectionHead" style="margin-top:0"><div><h2>Fixture manager</h2><p>${matches.length} fixtures stored in this browser</p></div><button class="btn small" onclick="exportData()">Export JSON ↓</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Match</th><th>Sport</th><th>Kick-off</th><th>Status</th><th>Action</th></tr></thead><tbody>${matches.map(m=>`<tr><td><strong>${esc(m.home)} vs ${esc(m.away)}</strong><br><span style="color:var(--muted)">${esc(m.competition)}</span></td><td>${esc(m.sport)}</td><td>${dateFmt(m.date)}</td><td>${esc(m.status)}</td><td><button class="btn small" onclick="editStatus(${m.id})">Change status</button> <button class="btn small" onclick="deleteMatch(${m.id})">Delete</button></td></tr>`).join('')}</tbody></table></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn" onclick="resetDemo()">Reset sample data</button><button class="btn" onclick="exportData()">Backup data</button></div></section>`}
function render(){const main=document.getElementById('main');if(currentPage==='home')main.innerHTML=home();else if(currentPage==='cricket'||currentPage==='football')main.innerHTML=sportPage(currentPage==='cricket'?'Cricket':'Football');else if(currentPage==='news')main.innerHTML=newsPage();else if(currentPage==='video')main.innerHTML=videoPage();else if(currentPage==='admin')main.innerHTML=adminPage();const mf=document.getElementById('matchForm');if(mf)mf.addEventListener('submit',addMatch);const nf=document.getElementById('newsForm');if(nf)nf.addEventListener('submit',addNews)}
function showMatch(id){const m=matches.find(x=>x.id===id);if(!m)return;document.getElementById('modal').innerHTML=`<div class="modalHead"><div><span class="eyebrow">${esc(m.sport)} / MATCH CENTRE</span><h2>${esc(m.home)} vs ${esc(m.away)}</h2><p style="color:var(--muted);margin:5px 0">${esc(m.competition)}</p></div><button class="close" onclick="closeModal()">✕</button></div><div class="modalScores"><div><div class="crest">${esc(m.homeIcon||'🏆')}</div><strong>${esc(m.home)}</strong><small>${esc(m.homeShort||'HOME')}</small><div class="score">${m.status==='Live'?esc(m.scoreHome):'—'}</div></div><div><span class="pill">${esc(m.status)}</span><div style="font-size:11px;color:var(--muted);margin-top:8px">${dateFmt(m.date)}</div><strong style="font-size:12px">VS</strong></div><div><div class="crest">${esc(m.awayIcon||'🏆')}</div><strong>${esc(m.away)}</strong><small>${esc(m.awayShort||'AWAY')}</small><div class="score">${m.status==='Live'?esc(m.scoreAway):'—'}</div></div></div><div class="detailRows"><div class="detail"><small>Venue</small><strong>${esc(m.venue||'To be confirmed')}</strong></div><div class="detail"><small>Competition</small><strong>${esc(m.competition)}</strong></div><div class="detail"><small>Broadcast</small><strong>Not connected</strong></div><div class="detail"><small>Lineups / stats</small><strong>Not available in demo</strong></div></div><div class="notice">${esc(m.note||'Sample data only. No live scores or official match details are connected.')}</div><button class="btn" onclick="closeModal()">Back to fixtures</button>`;document.getElementById('modalBackdrop').classList.add('open')}function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function addMatch(e){e.preventDefault();const f=new FormData(e.target),home=f.get('home').trim(),away=f.get('away').trim();const iso=new Date(f.get('date')).toISOString();matches.push({id:Date.now(),sport:f.get('sport'),competition:f.get('competition').trim()+' · Demo',home,away,homeShort:home.slice(0,3).toUpperCase(),awayShort:away.slice(0,3).toUpperCase(),homeIcon:f.get('sport')==='Cricket'?'🏏':'⚽',awayIcon:f.get('sport')==='Cricket'?'🏏':'⚽',date:iso,status:f.get('status'),venue:f.get('venue').trim()||'Venue TBC',scoreHome:f.get('scoreHome').trim()||'—',scoreAway:f.get('scoreAway').trim()||'—',note:'Added in local prototype; verify before publishing'});save();render();toast('Fixture saved in this browser')}
function addNews(e){e.preventDefault();const f=new FormData(e.target);news.unshift({id:Date.now(),icon:'📰',category:f.get('category').trim(),title:f.get('title').trim(),summary:f.get('summary').trim(),date:'Added locally'});save();render();toast('Story added to demo newsroom')}
function deleteMatch(id){if(!confirm('Delete this fixture from this browser?'))return;matches=matches.filter(m=>m.id!==id);save();render();toast('Fixture deleted')}function editStatus(id){const m=matches.find(x=>x.id===id);if(!m)return;const next=prompt('Set status: Upcoming, Live, or Finished',m.status);if(!next)return;const allowed=['Upcoming','Live','Finished'];if(!allowed.includes(next)){toast('Use Upcoming, Live, or Finished');return}m.status=next;save();render();toast('Status updated locally')}function resetDemo(){if(!confirm('Reset fixtures and news to the original sample data?'))return;matches=JSON.parse(JSON.stringify(initialMatches));news=JSON.parse(JSON.stringify(initialNews));save();render();toast('Sample data restored')}function exportData(){const blob=new Blob([JSON.stringify({matches,news,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fieldside-demo-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup export created')}
render();
</script></body></html>
